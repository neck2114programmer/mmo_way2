# Локальная разработка. Пароль берётся из окружения (POSTGRES_PASSWORD), в файле секретов нет.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eldoria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      POSTGRES_DB: eldoria
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - eldoria_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eldoria"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  eldoria_pg:
